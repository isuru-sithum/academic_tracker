<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — a record of your study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080b14; --surface:rgba(18,23,38,.78); --surface-2:rgba(23,29,48,.68);
  --surface-3:rgba(30,37,60,.82); --border:rgba(255,255,255,.09);
  --border-soft:rgba(255,255,255,.06); --text:#f5f7ff; --text-dim:#aab2c7;
  --text-faint:#727c96; --accent:#9b7cff; --accent-2:#5e9cff;
  --teal:#5fe0a2; --rose:#ff7da9; --indigo:#8d9cff;
  --font-display:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-body:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  min-height:100vh;color:var(--text);font-family:var(--font-body);
  background:
    radial-gradient(circle at 82% 0%,rgba(123,91,255,.18),transparent 31%),
    radial-gradient(circle at 4% 88%,rgba(45,171,255,.10),transparent 28%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
body:before{
  content:"";position:fixed;inset:0;pointer-events:none;opacity:.42;
  background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
  background-size:44px 44px;
  mask-image:linear-gradient(to bottom,#000,transparent 88%);
}
.wrap{max-width:1380px;margin:0 auto;padding:28px 34px 70px}

/* Header */
header{
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  margin-bottom:22px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:40px;height:40px;border:0;border-radius:13px;display:flex;
  align-items:center;justify-content:center;position:relative;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  box-shadow:0 10px 32px rgba(125,100,255,.28);
}
.brand-mark:before{content:"F";font-size:17px;font-weight:900;color:white}
.brand-mark:after{display:none}
.brand-name{font-size:17px;letter-spacing:.08em;font-weight:800}
.brand-tag{font-size:10px;color:var(--text-faint);font-family:var(--font-mono);margin-top:3px}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.save-status{
  font-family:var(--font-mono);font-size:10px;color:var(--text-dim);
  display:flex;align-items:center;gap:6px;padding:7px 10px;border:1px solid var(--border);
  border-radius:999px;background:rgba(255,255,255,.025)
}
.save-dot{width:6px;height:6px;border-radius:50%;background:var(--teal);transition:background .3s}
.save-dot.saving{background:var(--accent)}
.btn{
  font-family:var(--font-body);font-size:12px;font-weight:650;border-radius:10px;
  padding:9px 13px;cursor:pointer;border:1px solid var(--border);
  transition:all .15s ease;letter-spacing:.01em;background:rgba(255,255,255,.035);color:#dfe5f4
}
.btn-primary{
  border:0;background:linear-gradient(135deg,var(--accent),#7186ff);
  color:white;box-shadow:0 9px 28px rgba(124,103,255,.25)
}
.btn-primary:hover,.btn-ghost:hover{transform:translateY(-1px);background:var(--surface-3)}
.btn-primary:hover{background:linear-gradient(135deg,#a78bff,#7d91ff)}
.btn-ghost{background:rgba(255,255,255,.035);color:var(--text);border:1px solid var(--border)}

/* Main work grid */
.works{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.work.span-2{grid-column:1/-1}
.work{
  background:var(--surface);border:1px solid var(--border);border-radius:20px;
  padding:20px;position:relative;backdrop-filter:blur(18px);
  box-shadow:0 16px 45px rgba(0,0,0,.18);
  overflow:visible;transition:border-color .2s,transform .2s,box-shadow .2s
}
.work:hover{border-color:rgba(155,124,255,.24);box-shadow:0 20px 55px rgba(0,0,0,.24)}
.work-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:15px}
.work-heading{min-width:0;flex:1}
.eyebrow{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.13em;
  color:var(--accent);text-transform:uppercase;margin-bottom:7px;outline:none;cursor:text;display:inline-block
}
.eyebrow:focus{color:#c4b4ff}
.work-title{
  font-family:var(--font-display);font-style:normal;font-weight:750;font-size:19px;
  color:var(--text);outline:none;cursor:text;line-height:1.3;letter-spacing:-.02em
}
.work-title:focus{border-bottom:1px dashed var(--text-faint)}
.work-subtitle{font-size:11.5px;color:var(--text-dim);margin-top:4px;outline:none;cursor:text}
.empty-hint{color:var(--text-faint);font-style:italic}
.work-controls{display:flex;align-items:center;gap:5px;flex-shrink:0}
.icon-btn{
  width:28px;height:28px;border-radius:8px;border:1px solid var(--border);
  background:rgba(255,255,255,.035);color:var(--text-dim);display:flex;align-items:center;
  justify-content:center;cursor:pointer;font-size:11px;position:relative
}
.icon-btn:hover{color:var(--text);background:var(--surface-3)}
.menu{
  position:absolute;top:34px;right:0;background:var(--surface-3);
  border:1px solid var(--border);border-radius:10px;overflow:hidden;min-width:130px;
  z-index:50;box-shadow:0 14px 35px rgba(0,0,0,.45);display:none
}
.menu.open{display:block}
.menu button{
  display:block;width:100%;text-align:left;background:none;border:none;color:var(--text-dim);
  font-size:12px;padding:10px 13px;cursor:pointer;font-family:var(--font-body)
}
.menu button:hover{background:rgba(255,255,255,.05);color:var(--text)}
.menu button.danger:hover{color:var(--rose)}

/* Progress */
.primary{margin-bottom:14px}
.primary-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;gap:10px;flex-wrap:wrap}
.primary-label{font-size:11.5px;color:var(--text-dim)}
.primary-label b{color:var(--text);font-weight:650}
.primary-label input{
  background:none;border:none;color:var(--text);font-weight:650;font-family:var(--font-body);
  font-size:12px;outline:none;border-bottom:1px dashed var(--text-faint);width:85px
}
.primary-remaining{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim);white-space:nowrap}
.bar-track{height:7px;border-radius:999px;background:rgba(255,255,255,.065);overflow:hidden;position:relative}
.bar-fill{
  height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),#6e9bff);
  transition:width .4s ease;box-shadow:0 0 14px rgba(142,116,255,.25)
}
.primary-foot{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.primary-foot span{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim)}
.primary-foot .done-btn{margin-left:auto}

/* Trackers */
.trackers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:10px}
.tracker{
  background:var(--surface-2);border:1px solid var(--border-soft);border-radius:13px;
  padding:12px;position:relative
}
.tracker .del{position:absolute;top:7px;right:9px;color:var(--text-faint);font-size:10px;cursor:pointer;opacity:0;transition:opacity .15s}
.tracker:hover .del{opacity:1}
.tracker-head{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.tracker-name{
  font-family:var(--font-mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text-dim);outline:none;cursor:text;flex:1
}
.tracker-pct{font-family:var(--font-mono);font-size:9.5px;color:var(--text-dim)}
.tracker-next{font-size:12px;color:var(--text);margin-bottom:3px;outline:none;cursor:text;font-weight:600}
.tracker-sub{font-family:var(--font-mono);font-size:9px;color:var(--text-dim);margin-bottom:7px}
.tracker .bar-track{height:5px;margin-bottom:8px}
.tracker-foot{display:flex;align-items:center;justify-content:flex-end}
.mini-btn{
  font-family:var(--font-body);font-size:10px;font-weight:700;padding:6px 10px;
  border-radius:999px;border:none;cursor:pointer;background:var(--text);color:#080b14
}
.mini-btn:hover{background:#fff}
.mini-btn:disabled{background:var(--surface-3);color:var(--text-faint);cursor:default}
.mini-btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text-dim)}
.mini-btn.ghost:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.add-tracker{
  border:1px dashed var(--border);border-radius:13px;display:flex;align-items:center;
  justify-content:center;color:var(--text-dim);font-size:11px;cursor:pointer;min-height:48px
}

/* Checklist */
.checklist{display:flex;flex-direction:column;gap:7px;margin-top:6px}
.check-row{
  display:flex;align-items:center;gap:9px;background:var(--surface-2);
  border:1px solid var(--border-soft);border-radius:11px;padding:8px 10px;position:relative
}
.check-row .del{color:var(--text-faint);font-size:11px;cursor:pointer;opacity:0;transition:opacity .15s;margin-left:4px}
.check-row:hover .del{opacity:1}
.check-circle{
  width:15px;height:15px;border-radius:50%;border:1.5px solid var(--text-dim);flex-shrink:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center
}
.check-circle.done{background:var(--teal);border-color:var(--teal)}
.check-circle.done:after{content:'✓';font-size:9px;color:#07130e}
.check-text{flex:1;font-size:11.5px;outline:none;cursor:text}
.check-text.done{color:var(--text-faint);text-decoration:line-through}
.add-check-row{
  display:flex;align-items:center;gap:8px;padding:8px 10px;color:var(--text-dim);
  font-size:10.5px;cursor:pointer;border:1px dashed var(--border);border-radius:11px
}
.add-check-row:hover{color:var(--text);border-color:var(--text-faint)}
.quick-add-row{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.quick-add-row .btn-mini-ghost{
  font-family:var(--font-mono);font-size:9px;color:var(--text-dim);background:rgba(255,255,255,.02);
  border:1px solid var(--border-soft);border-radius:999px;padding:6px 10px;cursor:pointer
}
.quick-add-row .btn-mini-ghost:hover{color:var(--text);border-color:var(--text-faint);background:rgba(255,255,255,.04)}

/* Empty state */
.empty-state{
  grid-column:1/-1;text-align:center;padding:80px 20px;border:1px dashed var(--border);
  border-radius:20px;background:rgba(18,23,38,.55)
}
.empty-state h2{font-family:var(--font-display);font-weight:750;font-size:24px;margin:0 0 8px;color:var(--text)}
.empty-state p{color:var(--text-dim);font-size:12px;margin:0 0 20px}

/* Modals */
.overlay{
  position:fixed;inset:0;background:rgba(5,6,12,.72);backdrop-filter:blur(8px);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px
}
.overlay.open{display:flex}
.modal{
  background:linear-gradient(145deg,rgba(28,34,56,.96),rgba(16,21,35,.98));
  border:1px solid var(--border);border-radius:20px;padding:28px;width:100%;max-width:440px;
  box-shadow:0 25px 80px rgba(0,0,0,.5)
}
.modal h3{font-family:var(--font-display);font-weight:750;font-size:22px;margin:0 0 20px}
.field{margin-bottom:16px}
.field label{
  display:block;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--text-dim);margin-bottom:7px
}
.field input,.field select{
  width:100%;background:rgba(8,11,20,.65);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;color:var(--text);font-family:var(--font-body);font-size:13px;outline:none
}
.field input:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(155,124,255,.09)}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}
::selection{background:rgba(155,124,255,.28)}
.work-complete{opacity:.7}
.work-complete:hover{opacity:.92}
.icon-btn[data-action="move-up"],.icon-btn[data-action="move-down"]{font-size:8px}

@media(max-width:800px){
  .wrap{padding:22px 18px 50px}
  .works{grid-template-columns:1fr}
  .work.span-2{grid-column:auto}
}
@media(max-width:600px){
  header{align-items:flex-start}
  .header-right{width:100%}
  .header-right .save-status{order:-1;width:100%;justify-content:center}
  .work{padding:16px;border-radius:17px}
  .work-title{font-size:17px}
  .trackers{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">FOLIO</div>
        <div class="brand-tag">a record of your study</div>
      </div>
    </div>
    <div class="header-right">
      <div class="save-status"><span class="save-dot" id="saveDot"></span><span id="saveText">saved</span></div>
      <button class="btn btn-ghost" id="settingsBtn" title="GitHub sync settings">⚙ Sync</button>
      <button class="btn btn-ghost" id="exportBtn" title="Download a backup file">Export</button>
      <button class="btn btn-ghost" id="importBtn" title="Restore from a backup file">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn btn-primary" id="addWorkBtn">+ Add work</button>
    </div>
  </header>

  <div class="works" id="works"></div>
</div>

<div class="overlay" id="connectOverlay">
  <div class="modal">
    <h3>Connect to GitHub</h3>
    <p style="font-size:12.5px;color:var(--text-dim);margin:-8px 0 18px;line-height:1.55;">
      Folio stores your data in a private GitHub Gist, so it follows you across devices instead of staying stuck in one browser.
      Create a <a href="https://github.com/settings/tokens/new?description=Folio&scopes=gist" target="_blank" rel="noopener" style="color:var(--accent);">Personal Access Token</a>
      with only the <b style="color:var(--text);">gist</b> scope checked, then paste it below.
    </p>
    <div class="field">
      <label>Personal Access Token</label>
      <input id="ghTokenInput" type="password" placeholder="ghp_..." autocomplete="off">
    </div>
    <div class="field">
      <label>Setup</label>
      <select id="ghModeSelect">
        <option value="new">Create a new gist (first device)</option>
        <option value="existing">Connect to an existing gist (another device)</option>
      </select>
    </div>
    <div class="field" id="ghGistField" style="display:none;">
      <label>Gist ID</label>
      <input id="ghGistInput" placeholder="paste the Gist ID from your other device" autocomplete="off">
    </div>
    <div id="connectError" style="display:none;color:var(--rose);font-size:12px;margin-bottom:12px;line-height:1.5;"></div>
    <div class="modal-actions">
      <button class="btn btn-primary" id="connectBtn" style="width:100%;">Connect</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <h3>Sync settings</h3>
    <div class="field">
      <label>Gist ID — use this + your token to connect another device</label>
      <input id="gistIdDisplay" readonly>
    </div>
    <div class="modal-actions" style="justify-content:space-between;">
      <button class="btn btn-ghost" id="disconnectBtn" style="color:var(--rose);">Disconnect this device</button>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="copyGistBtn">Copy ID</button>
        <button class="btn btn-primary" id="closeSettingsBtn">Done</button>
      </div>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add work</h3>
    <div class="field">
      <label>Category</label>
      <select id="newCategory">
        <option value="COURSE">Course</option>
        <option value="TEXTBOOK">Textbook</option>
        <option value="NOVEL">Novel</option>
        <option value="PAPER">Paper</option>
        <option value="CUSTOM">Custom</option>
      </select>
    </div>
    <div class="field">
      <label>Title</label>
      <input id="newTitle" placeholder="e.g. MIT 8.04 Quantum Physics I" autocomplete="off">
    </div>
    <div class="field">
      <label>Subtitle (optional)</label>
      <input id="newSubtitle" placeholder="Instructor, author, or notes" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
      <button class="btn btn-primary" id="confirmAdd">Create</button>
    </div>
  </div>
</div>

<script>
(function(){
  const COLORS = ['teal','accent','rose','indigo'];
  let works = [];
  let saveTimer = null;

  const worksEl = document.getElementById('works');
  const overlay = document.getElementById('overlay');
  const saveDot = document.getElementById('saveDot');
  const saveText = document.getElementById('saveText');

  function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function colorVar(c){
    if(c==='teal') return 'var(--teal)';
    if(c==='rose') return 'var(--rose)';
    if(c==='indigo') return 'var(--indigo)';
    return 'var(--accent)';
  }

  const GH_TOKEN_KEY = 'folio-gh-token';
  const GH_GIST_KEY = 'folio-gh-gistid';
  const CACHE_KEY = 'folio-cache';
  const GIST_FILENAME = 'folio-data.json';
  let ghToken = null;
  let ghGistId = null;

  function timeNow(){
    const t = new Date();
    const h = t.getHours()%12===0?12:t.getHours()%12;
    const m = String(t.getMinutes()).padStart(2,'0');
    const ap = t.getHours()>=12?'pm':'am';
    return h + ':' + m + ap;
  }

  function setSyncStatus(text, isError){
    saveDot.classList.remove('saving');
    saveDot.style.background = isError ? 'var(--rose)' : '';
    saveText.textContent = text;
  }

  async function ghRequest(url, options={}){
    const res = await fetch(url, {
      ...options,
      headers: {
        'Authorization': 'token ' + ghToken,
        'Accept': 'application/vnd.github+json',
        ...(options.headers || {})
      }
    });
    if(!res.ok){
      const body = await res.text().catch(()=>'');
      throw new Error('GitHub API ' + res.status + ': ' + body.slice(0,200));
    }
    return res.json();
  }

  async function ghCreateGist(initialWorks){
    const data = await ghRequest('https://api.github.com/gists', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        description: 'Folio academic tracker data',
        public: false,
        files: { [GIST_FILENAME]: { content: JSON.stringify(initialWorks, null, 2) } }
      })
    });
    return data.id;
  }

  async function ghGetGist(gistId){
    const data = await ghRequest('https://api.github.com/gists/' + gistId);
    const file = data.files && data.files[GIST_FILENAME];
    if(!file) throw new Error('That gist has no ' + GIST_FILENAME + ' file.');
    let content = file.content;
    if(file.truncated){
      const rawRes = await fetch(file.raw_url);
      content = await rawRes.text();
    }
    return JSON.parse(content || '[]');
  }

  async function ghUpdateGist(gistId, worksData){
    await ghRequest('https://api.github.com/gists/' + gistId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        files: { [GIST_FILENAME]: { content: JSON.stringify(worksData, null, 2) } }
      })
    });
  }

  function loadCredentials(){
    ghToken = localStorage.getItem(GH_TOKEN_KEY) || null;
    ghGistId = localStorage.getItem(GH_GIST_KEY) || null;
  }

  function saveCredentials(token, gistId){
    ghToken = token; ghGistId = gistId;
    localStorage.setItem(GH_TOKEN_KEY, token);
    localStorage.setItem(GH_GIST_KEY, gistId);
  }

  function clearCredentials(){
    ghToken = null; ghGistId = null;
    localStorage.removeItem(GH_TOKEN_KEY);
    localStorage.removeItem(GH_GIST_KEY);
  }

  function showConnectModal(errorMsg){
    document.getElementById('connectOverlay').classList.add('open');
    const errEl = document.getElementById('connectError');
    if(errorMsg){ errEl.textContent = errorMsg; errEl.style.display = 'block'; }
    else { errEl.style.display = 'none'; }
  }

  async function init(){
    loadCredentials();
    if(!ghToken || !ghGistId){
      // show any cached copy immediately while waiting to connect, so nothing looks lost
      try{
        const cached = localStorage.getItem(CACHE_KEY);
        if(cached) works = JSON.parse(cached);
      }catch(e){}
      render();
      setSyncStatus('not connected', true);
      showConnectModal();
      return;
    }
    await syncFromGitHub(true);
  }

  async function syncFromGitHub(initial){
    setSyncStatus('connecting…', false);
    saveDot.classList.add('saving');
    try{
      works = await ghGetGist(ghGistId);
      localStorage.setItem(CACHE_KEY, JSON.stringify(works));
      setSyncStatus('synced · ' + timeNow(), false);
      render();
    }catch(e){
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached){
        works = JSON.parse(cached);
        render();
        setSyncStatus('offline — showing last synced copy', true);
      } else {
        setSyncStatus('connection failed', true);
        if(initial) showConnectModal('Could not load that gist. Check your token and Gist ID, then try again from Settings.');
      }
    }
  }

  function scheduleSave(){
    saveDot.classList.add('saving');
    saveText.textContent = 'syncing…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 500);
  }

  async function doSave(){
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(works)); }catch(e){}
    if(!ghToken || !ghGistId){ setSyncStatus('not connected', true); return; }
    try{
      await ghUpdateGist(ghGistId, works);
      setSyncStatus('synced · ' + timeNow(), false);
    }catch(e){
      setSyncStatus('sync failed — will retry on next change', true);
    }
  }

  function exportBackup(){
    const blob = new Blob([JSON.stringify(works, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href = url; a.download = 'folio-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!Array.isArray(data)) throw new Error('bad format');
        if(works.length && !confirm('This will replace your current '+works.length+' item(s) with '+data.length+' from the backup. Continue?')) return;
        works = data;
        scheduleSave(); render();
      }catch(err){
        alert('Could not read that file as a Folio backup.');
      }
    };
    reader.readAsText(file);
  }

  function touch(work){ work.updatedAt = Date.now(); }

  function findWork(id){ return works.find(w=>w.id===id); }

  // ---------------- render ----------------
  function render(){
    worksEl.innerHTML = '';
    if(works.length===0){
      worksEl.innerHTML = `
        <div class="empty-state">
          <h2>Nothing logged yet</h2>
          <p>Add your first course, textbook, or novel to begin the record.</p>
          <button class="btn btn-primary" id="emptyAddBtn">+ Add work</button>
        </div>`;
      document.getElementById('emptyAddBtn').onclick = openModal;
      return;
    }
    getDisplayOrder().forEach(work => worksEl.appendChild(renderWork(work)));
  }

  function isComplete(work){
    const hasAny = work.primary || work.trackers.length || work.checklist.length;
    if(!hasAny) return false;
    if(work.primary && work.primary.completed < work.primary.total) return false;
    if(work.trackers.some(t => t.completed < t.total)) return false;
    if(work.checklist.some(c => !c.done)) return false;
    return true;
  }

  function getDisplayOrder(){
    return works
      .map((w, i) => ({ w, i, c: isComplete(w) ? 1 : 0 }))
      .sort((a, b) => (a.c - b.c) || (a.i - b.i))
      .map(x => x.w);
  }

  function moveWork(id, dir){
    const display = getDisplayOrder();
    const idx = display.findIndex(w => w.id === id);
    const targetIdx = idx + dir;
    if(targetIdx < 0 || targetIdx >= display.length) return;
    // only reorder within the same completed/active group — completed items always stay at the bottom
    if(isComplete(display[idx]) !== isComplete(display[targetIdx])) return;
    const realA = works.findIndex(w => w.id === display[idx].id);
    const realB = works.findIndex(w => w.id === display[targetIdx].id);
    [works[realA], works[realB]] = [works[realB], works[realA]];
    scheduleSave(); render();
  }

  function renderWork(work){
    const card = document.createElement('div');
    card.className = 'work' + (work.trackers.length >= 2 ? ' span-2' : '');

    // top
    const top = document.createElement('div');
    top.className = 'work-top';
    top.innerHTML = `
      <div class="work-heading">
        <div class="eyebrow" contenteditable="true" data-field="category">${escapeHtml(work.category||'CUSTOM')}</div>
        <div class="work-title" contenteditable="true" data-field="title">${escapeHtml(work.title||'Untitled')}</div>
        <div class="work-subtitle" contenteditable="true" data-field="subtitle">${work.subtitle ? escapeHtml(work.subtitle) : ''}</div>
      </div>
      <div class="work-controls">
        <button class="icon-btn" data-action="move-up" title="Move up">▲</button>
        <button class="icon-btn" data-action="move-down" title="Move down">▼</button>
        <div style="position:relative;">
          <button class="icon-btn" data-action="menu">⋯</button>
          <div class="menu" data-menu>
            <button data-action="delete-work">Delete work</button>
          </div>
        </div>
      </div>`;
    card.appendChild(top);

    top.querySelector('[data-field="category"]').addEventListener('blur', e=>{
      work.category = e.target.textContent.trim().toUpperCase() || 'CUSTOM';
      touch(work); scheduleSave();
    });
    top.querySelector('[data-field="title"]').addEventListener('blur', e=>{
      work.title = e.target.textContent.trim() || 'Untitled';
      touch(work); scheduleSave();
    });
    const subtitleEl = top.querySelector('[data-field="subtitle"]');
    subtitleEl.setAttribute('data-placeholder', 'Add instructor, author, or notes');
    if(!work.subtitle) subtitleEl.classList.add('empty-hint');
    if(!work.subtitle) subtitleEl.textContent = '';
    subtitleEl.addEventListener('focus', e=>{ e.target.classList.remove('empty-hint'); });
    subtitleEl.addEventListener('blur', e=>{
      const v = e.target.textContent.trim();
      work.subtitle = v;
      if(!v){ e.target.classList.add('empty-hint'); e.target.textContent=''; }
      touch(work); scheduleSave();
    });

    top.querySelector('[data-action="move-up"]').addEventListener('click', ()=> moveWork(work.id, -1));
    top.querySelector('[data-action="move-down"]').addEventListener('click', ()=> moveWork(work.id, 1));

    if(isComplete(work)){
      const badge = document.createElement('span');
      badge.textContent = '✓ complete';
      badge.style.cssText = 'font-family:var(--font-mono);font-size:9px;color:var(--teal);white-space:nowrap;align-self:center;margin-right:4px;';
      top.querySelector('.work-controls').prepend(badge);
      card.classList.add('work-complete');
    }

    const menuBtn = top.querySelector('[data-action="menu"]');
    const menuEl = top.querySelector('[data-menu]');
    menuBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.menu.open').forEach(m=>{ if(m!==menuEl) m.classList.remove('open'); });
      menuEl.classList.toggle('open');
    });
    top.querySelector('[data-action="delete-work"]').addEventListener('click', ()=>{
      if(confirm('Delete "'+work.title+'"? This cannot be undone.')){
        works = works.filter(w=>w.id!==work.id);
        scheduleSave(); render();
      }
    });

    // primary
    if(work.primary){
      card.appendChild(renderPrimary(work));
    }

    // trackers
    if(work.trackers.length){
      const trackWrap = document.createElement('div');
      trackWrap.className = 'trackers';
      work.trackers.forEach(t => trackWrap.appendChild(renderTracker(work, t)));
      card.appendChild(trackWrap);
    }

    // checklist
    if(work.checklist.length || work.showChecklist){
      const cl = document.createElement('div');
      cl.className = 'checklist';
      work.checklist.forEach(item => cl.appendChild(renderCheckItem(work, item)));
      const addRow = document.createElement('div');
      addRow.className = 'add-check-row';
      addRow.textContent = '+ Add checklist item';
      addRow.addEventListener('click', ()=>{
        const text = prompt('Item text (e.g. Read & understand)');
        if(!text) return;
        work.checklist.push({ id: uid(), text, done:false });
        touch(work); scheduleSave(); render();
      });
      cl.appendChild(addRow);
      card.appendChild(cl);
    }

    // quick add row — always offers "+ tracker"; conditionally offers progress/checklist
    const quick = document.createElement('div');
    quick.className = 'quick-add-row';

    const addTrackerBtn = document.createElement('button');
    addTrackerBtn.className = 'btn-mini-ghost';
    addTrackerBtn.textContent = '+ tracker';
    addTrackerBtn.addEventListener('click', ()=>{
      const name = prompt('Tracker name (e.g. Videos, Problem Sets, Exams)');
      if(!name) return;
      const unit = prompt('Unit label for one item (e.g. Video, Set, Exam)', name.replace(/s$/,'')) || name;
      const total = parseInt(prompt('Total count', '10')) || 1;
      work.trackers.push({
        id: uid(), name, unit, completed: 0, total,
        next: unit + ' 1', color: COLORS[work.trackers.length % COLORS.length]
      });
      touch(work); scheduleSave(); render();
    });
    quick.appendChild(addTrackerBtn);

    if(!work.primary){
      const b = document.createElement('button');
      b.className = 'btn-mini-ghost';
      b.textContent = '+ progress (e.g. chapters)';
      b.addEventListener('click', ()=>{
        const unit = prompt('What are you counting? (e.g. Chapter, Page)', 'Chapter');
        if(!unit) return;
        const total = parseInt(prompt('Total ' + unit.toLowerCase() + 's', '10')) || 1;
        work.primary = { unit, completed: 0, total, currentLabel: unit + ' 1' };
        touch(work); scheduleSave(); render();
      });
      quick.appendChild(b);
    }
    if(!work.checklist.length && !work.showChecklist){
      const b2 = document.createElement('button');
      b2.className = 'btn-mini-ghost';
      b2.textContent = '+ checklist';
      b2.addEventListener('click', ()=>{
        work.showChecklist = true;
        touch(work); scheduleSave(); render();
      });
      quick.appendChild(b2);
    }
    if(quick.children.length) card.appendChild(quick);

    return card;
  }

  function renderPrimary(work){
    const p = work.primary;
    const wrap = document.createElement('div');
    wrap.className = 'primary';
    const pct = Math.min(100, Math.round((p.completed / Math.max(p.total,1)) * 100));
    const remaining = Math.max(p.total - p.completed, 0);
    wrap.innerHTML = `
      <div class="primary-row">
        <div class="primary-label">Current · <input type="text" value="${escapeAttr(p.currentLabel)}" data-cur></div>
        <div class="primary-remaining">${remaining} ${p.unit.toLowerCase()}${remaining===1?'':'s'} remaining</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="primary-foot">
        <span>${p.completed} completed</span>
        <span style="margin-left:16px;">total: <input type="text" value="${p.total}" data-total style="width:36px;background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;outline:none;border-bottom:1px dashed var(--text-faint);"></span>
        <button class="mini-btn ghost done-btn" data-action="undo" ${p.completed<=0?'disabled':''} style="margin-left:auto;">Undo</button>
        <button class="mini-btn done-btn" ${p.completed>=p.total?'disabled':''} data-action="advance">${p.completed>=p.total?'Complete':'Done'}</button>
      </div>`;
    wrap.querySelector('[data-cur]').addEventListener('blur', e=>{
      p.currentLabel = e.target.value.trim(); touch(work); scheduleSave();
    });
    wrap.querySelector('[data-total]').addEventListener('blur', e=>{
      const v = parseInt(e.target.value); if(v>0){ p.total = v; touch(work); scheduleSave(); render(); }
    });
    const btn = wrap.querySelector('[data-action="advance"]');
    if(btn) btn.addEventListener('click', ()=>{
      const prevDefault = p.unit + ' ' + (p.completed+1);
      if(p.completed < p.total) p.completed += 1;
      if(p.currentLabel === (p.unit + ' ' + p.completed) || p.currentLabel === prevDefault || !p.currentLabel){
        p.currentLabel = p.unit + ' ' + Math.min(p.completed+1, p.total);
      }
      touch(work); scheduleSave(); render();
    });
    const undoBtn = wrap.querySelector('[data-action="undo"]');
    if(undoBtn) undoBtn.addEventListener('click', ()=>{
      if(p.completed<=0) return;
      const defaultLabel = p.unit + ' ' + (p.completed+1);
      p.completed -= 1;
      if(p.currentLabel === defaultLabel || !p.currentLabel){
        p.currentLabel = p.unit + ' ' + Math.min(p.completed+1, p.total);
      }
      touch(work); scheduleSave(); render();
    });
    return wrap;
  }

  function renderTracker(work, t){
    const el = document.createElement('div');
    el.className = 'tracker';
    const pct = Math.min(100, Math.round((t.completed / Math.max(t.total,1)) * 100));
    const remaining = Math.max(t.total - t.completed, 0);
    el.innerHTML = `
      <span class="del" data-action="del-tracker">✕</span>
      <div class="tracker-head">
        <span class="dot" style="background:${colorVar(t.color)}"></span>
        <span class="tracker-name" contenteditable="true" data-field="name">${escapeHtml(t.name)}</span>
        <span class="tracker-pct">${pct}%</span>
      </div>
      <div class="tracker-next" contenteditable="true" data-field="next">Next · ${escapeHtml(t.next||'')}</div>
      <div class="tracker-sub">${t.completed} completed</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${colorVar(t.color)}"></div></div>
      <div class="tracker-foot">
        <span class="tracker-sub" style="margin-right:auto;">${remaining} remaining</span>
        <button class="mini-btn ghost" data-action="undo" ${t.completed<=0?'disabled':''} style="margin-right:6px;">Undo</button>
        <button class="mini-btn" data-action="advance" ${t.completed>=t.total?'disabled':''}>${t.completed>=t.total?'Complete':'Done'}</button>
      </div>`;

    el.querySelector('[data-action="del-tracker"]').addEventListener('click', ()=>{
      work.trackers = work.trackers.filter(x=>x.id!==t.id);
      touch(work); scheduleSave(); render();
    });
    el.querySelector('[data-field="name"]').addEventListener('blur', e=>{
      t.name = e.target.textContent.trim() || t.name; touch(work); scheduleSave();
    });
    const nextEl = el.querySelector('[data-field="next"]');
    nextEl.addEventListener('focus', e=>{ e.target.textContent = t.next||''; });
    nextEl.addEventListener('blur', e=>{
      t.next = e.target.textContent.replace(/^Next\s*·\s*/,'').trim();
      touch(work); scheduleSave(); render();
    });
    const undoBtn = el.querySelector('[data-action="undo"]');
    if(undoBtn) undoBtn.addEventListener('click', ()=>{
      if(t.completed<=0) return;
      const defaultNext = t.unit + ' ' + (t.completed+1);
      t.completed -= 1;
      if(t.next === defaultNext || !t.next){
        t.next = t.unit + ' ' + (t.completed+1);
      }
      touch(work); scheduleSave(); render();
    });
    const advBtn = el.querySelector('[data-action="advance"]');
    if(advBtn) advBtn.addEventListener('click', ()=>{
      const prevDefault = t.unit + ' ' + (t.completed+1);
      if(t.completed < t.total) t.completed += 1;
      if(t.next === prevDefault || !t.next || t.next === (t.unit + ' ' + t.completed)){
        t.next = t.unit + ' ' + Math.min(t.completed+1, t.total);
      }
      touch(work); scheduleSave(); render();
    });
    return el;
  }

  function renderCheckItem(work, item){
    const row = document.createElement('div');
    row.className = 'check-row';
    row.innerHTML = `
      <div class="check-circle ${item.done?'done':''}" data-action="toggle"></div>
      <div class="check-text ${item.done?'done':''}" contenteditable="true" data-field="text">${escapeHtml(item.text)}</div>
      <button class="mini-btn ghost" data-action="toggle-btn">${item.done?'Undo':'Done'}</button>
      <span class="del" data-action="del-item">✕</span>`;
    const toggle = ()=>{ item.done = !item.done; touch(work); scheduleSave(); render(); };
    row.querySelector('[data-action="toggle"]').addEventListener('click', toggle);
    row.querySelector('[data-action="toggle-btn"]').addEventListener('click', toggle);
    row.querySelector('[data-field="text"]').addEventListener('blur', e=>{
      item.text = e.target.textContent.trim() || item.text; touch(work); scheduleSave();
    });
    row.querySelector('[data-action="del-item"]').addEventListener('click', ()=>{
      work.checklist = work.checklist.filter(x=>x.id!==item.id);
      touch(work); scheduleSave(); render();
    });
    return row;
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // close menus when clicking elsewhere
  document.addEventListener('click', ()=>{
    document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  });

  // ---------------- add work modal ----------------
  function openModal(){
    overlay.classList.add('open');
    document.getElementById('newTitle').value = '';
    document.getElementById('newSubtitle').value = '';
    document.getElementById('newCategory').value = 'COURSE';
    document.getElementById('newTitle').focus();
  }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('addWorkBtn').addEventListener('click', openModal);
  document.getElementById('cancelAdd').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  document.getElementById('confirmAdd').addEventListener('click', ()=>{
    const title = document.getElementById('newTitle').value.trim();
    if(!title){ document.getElementById('newTitle').focus(); return; }
    const category = document.getElementById('newCategory').value;
    const subtitle = document.getElementById('newSubtitle').value.trim();
    works.unshift({
      id: uid(), category, title, subtitle,
      primary: null, trackers: [], checklist: [], showChecklist:false,
      createdAt: Date.now(), updatedAt: Date.now()
    });
    scheduleSave(); render(); closeModal();
  });

  document.getElementById('newTitle').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('confirmAdd').click();
  });

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });

  // ---------------- GitHub connect / settings ----------------
  document.getElementById('ghModeSelect').addEventListener('change', e=>{
    document.getElementById('ghGistField').style.display = e.target.value === 'existing' ? 'block' : 'none';
  });

  document.getElementById('connectBtn').addEventListener('click', async ()=>{
    const token = document.getElementById('ghTokenInput').value.trim();
    const mode = document.getElementById('ghModeSelect').value;
    const gistIdInput = document.getElementById('ghGistInput').value.trim();
    const errEl = document.getElementById('connectError');
    errEl.style.display = 'none';
    if(!token){ errEl.textContent = 'Enter a token.'; errEl.style.display = 'block'; return; }
    if(mode === 'existing' && !gistIdInput){ errEl.textContent = 'Enter the Gist ID from your other device.'; errEl.style.display = 'block'; return; }

    const btn = document.getElementById('connectBtn');
    btn.disabled = true; btn.textContent = 'Connecting…';
    ghToken = token;
    try{
      let gistId, data;
      if(mode === 'new'){
        gistId = await ghCreateGist([]);
        data = [];
      } else {
        gistId = gistIdInput;
        data = await ghGetGist(gistId);
      }
      saveCredentials(token, gistId);
      works = data;
      localStorage.setItem(CACHE_KEY, JSON.stringify(works));
      document.getElementById('connectOverlay').classList.remove('open');
      document.getElementById('ghTokenInput').value = '';
      setSyncStatus('synced · ' + timeNow(), false);
      render();
    }catch(e){
      ghToken = null;
      errEl.textContent = 'Could not connect — check your token' + (mode === 'existing' ? ' and Gist ID.' : ', then try again.');
      errEl.style.display = 'block';
    }
    btn.disabled = false; btn.textContent = 'Connect';
  });

  document.getElementById('settingsBtn').addEventListener('click', ()=>{
    if(!ghGistId){ showConnectModal(); return; }
    document.getElementById('gistIdDisplay').value = ghGistId;
    document.getElementById('settingsOverlay').classList.add('open');
  });
  document.getElementById('closeSettingsBtn').addEventListener('click', ()=>{
    document.getElementById('settingsOverlay').classList.remove('open');
  });
  document.getElementById('settingsOverlay').addEventListener('click', e=>{
    if(e.target.id === 'settingsOverlay') document.getElementById('settingsOverlay').classList.remove('open');
  });
  document.getElementById('copyGistBtn').addEventListener('click', ()=>{
    const el = document.getElementById('gistIdDisplay');
    el.select();
    navigator.clipboard?.writeText(el.value).catch(()=>{});
    const btn = document.getElementById('copyGistBtn');
    const orig = btn.textContent;
    btn.textContent = 'Copied!';
    setTimeout(()=>{ btn.textContent = orig; }, 1200);
  });
  document.getElementById('disconnectBtn').addEventListener('click', ()=>{
    if(!confirm('Disconnect GitHub sync on this device? Your data stays safe in the gist — reconnect anytime with your token and this Gist ID.')) return;
    clearCredentials();
    works = [];
    document.getElementById('settingsOverlay').classList.remove('open');
    render();
    setSyncStatus('not connected', true);
    showConnectModal();
  });

  init();
})();
</script>
</body>
</html>
