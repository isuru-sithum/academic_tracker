<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Folio — a record of your study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0d10;
    --surface: #14171b;
    --surface-2: #1b1f24;
    --surface-3: #21262c;
    --border: #262b31;
    --border-soft: #1e2227;
    --text: #f4f5f6;
    --text-dim: #b3b9c2;
    --text-faint: #838a94;
    --accent: #c9a24b;
    --accent-soft: rgba(201,162,75,0.14);
    --teal: #5ec9b9;
    --rose: #c97b84;
    --indigo: #8b93e8;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    background: var(--bg);
    background-image:
      radial-gradient(circle at 85% 0%, rgba(201,162,75,0.05), transparent 45%),
      radial-gradient(circle at 0% 90%, rgba(94,201,185,0.04), transparent 40%);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; padding: 22px 22px 60px; }

  /* ---------- header ---------- */
  header{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 16px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{
    width:28px; height:28px; border-radius:50%;
    border: 1.5px solid var(--accent);
    display:flex; align-items:center; justify-content:center;
    position:relative; flex-shrink:0;
  }
  .brand-mark::after{
    content:''; width:6px; height:6px; border-radius:50%; background: var(--accent);
  }
  .brand-name{ font-family: var(--font-display); font-size: 19px; letter-spacing: 0.04em; font-weight:600; }
  .brand-tag{ font-size: 11.5px; color: var(--text-faint); font-family: var(--font-mono); margin-top:1px; }

  .header-right{ display:flex; align-items:center; gap:8px; }
  .save-status{
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim);
    display:flex; align-items:center; gap:6px; padding: 6px 2px;
  }
  .save-dot{ width:5px; height:5px; border-radius:50%; background: var(--teal); transition: background .3s; }
  .save-dot.saving{ background: var(--accent); }

  .btn{
    font-family: var(--font-body); font-size: 13.5px; font-weight: 600;
    border-radius: 999px; padding: 8px 15px; cursor:pointer; border: none;
    transition: all .15s ease; letter-spacing: 0.01em;
  }
  .btn-primary{ background: var(--text); color: #0b0d10; }
  .btn-primary:hover{ background: #fff; transform: translateY(-1px); }
  .btn-ghost{ background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .btn-ghost:hover{ background: var(--surface-3); }

  /* ---------- work card ---------- */
  .works{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
  .work.span-2{ grid-column: 1 / -1; }

  .work{
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 14px 16px;
    position: relative;
  }

  .work-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom: 10px; }
  .work-heading{ min-width:0; flex:1; }
  .eyebrow{
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.1em;
    color: var(--text-dim); text-transform: uppercase; margin-bottom: 4px;
    outline:none; cursor:text; display:inline-block;
  }
  .eyebrow:focus{ color: var(--accent); }
  .work-title{
    font-family: var(--font-display); font-style: italic; font-weight: 500;
    font-size: 19px; color: var(--text); outline:none; cursor:text;
    line-height:1.3;
  }
  .work-title:focus{ border-bottom: 1px dashed var(--text-faint); }
  .work-subtitle{
    font-size: 12.5px; color: var(--text-dim); margin-top: 2px; outline:none; cursor:text;
  }
  .empty-hint{ color: var(--text-faint); font-style:italic; }

  .work-controls{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .icon-btn{
    width: 24px; height:24px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text-dim); display:flex; align-items:center;
    justify-content:center; cursor:pointer; font-size:12.5px; position:relative;
  }
  .icon-btn:hover{ color: var(--text); background: var(--surface-3); }

  .menu{
    position:absolute; top: 30px; right: 0; background: var(--surface-3);
    border: 1px solid var(--border); border-radius: 8px; overflow:hidden;
    min-width: 120px; z-index: 20; box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    display:none;
  }
  .menu.open{ display:block; }
  .menu button{
    display:block; width:100%; text-align:left; background:none; border:none;
    color: var(--text-dim); font-size: 12.5px; padding: 9px 12px; cursor:pointer; font-family: var(--font-body);
  }
  .menu button:hover{ background: var(--surface-2); color: var(--text); }
  .menu button.danger:hover{ color: var(--rose); }

  /* primary progress */
  .primary{ margin-bottom: 12px; }
  .primary-row{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px; gap:10px; flex-wrap:wrap;}
  .primary-label{ font-size: 13px; color: var(--text-dim); }
  .primary-label b{ color: var(--text); font-weight:600; }
  .primary-label input{ background:none; border:none; color: var(--text); font-weight:600; font-family:var(--font-body); font-size:13px; outline:none; border-bottom:1px dashed var(--text-faint); width: 85px;}
  .primary-remaining{ font-family: var(--font-mono); font-size: 11.5px; color: var(--text-dim); white-space:nowrap; }
  .bar-track{ height: 6px; border-radius: 999px; background: var(--surface-2); overflow:hidden; position:relative; }
  .bar-fill{ height:100%; border-radius:999px; background: linear-gradient(90deg, var(--accent), #e4c987); transition: width .4s ease; }
  .primary-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:6px; }
  .primary-foot span{ font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
  .primary-foot .done-btn{ margin-left:auto; }

  /* trackers grid */
  .trackers{ display:grid; grid-template-columns: repeat(auto-fill, minmax(150px, 220px)); justify-content:start; gap: 8px; margin-bottom: 8px; }
  .tracker{
    background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 9px;
    padding: 9px 10px; position:relative;
  }
  .tracker .del{
    position:absolute; top:6px; right:7px; color: var(--text-faint); font-size:11px;
    cursor:pointer; opacity:0; transition:opacity .15s;
  }
  .tracker:hover .del{ opacity:1; }
  .tracker-head{ display:flex; align-items:center; gap:5px; margin-bottom:6px; }
  .dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .tracker-name{
    font-family: var(--font-mono); font-size: 10px; letter-spacing:0.08em; text-transform:uppercase;
    color: var(--text-dim); outline:none; cursor:text; flex:1;
  }
  .tracker-pct{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); }
  .tracker-next{
    font-size: 13.5px; color: var(--text); margin-bottom: 2px; outline:none; cursor:text; font-weight:500;
  }
  .tracker-sub{ font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); margin-bottom: 6px; }
  .tracker .bar-track{ height:5px; margin-bottom:7px; }
  .tracker-foot{ display:flex; align-items:center; justify-content:flex-end; }

  .mini-btn{
    font-family: var(--font-body); font-size: 11.5px; font-weight:600; padding: 5px 11px;
    border-radius: 999px; border:none; cursor:pointer; background: var(--text); color:#0b0d10;
  }
  .mini-btn:hover{ background:#fff; }
  .mini-btn:disabled{ background: var(--surface-3); color: var(--text-faint); cursor:default; }
  .mini-btn.ghost{ background:transparent; border:1px dashed var(--border); color: var(--text-dim); }
  .mini-btn.ghost:hover{ color: var(--text); border-color: var(--text-faint); }

  .add-tracker{
    border: 1px dashed var(--border); border-radius: 9px; display:flex; align-items:center;
    justify-content:center; color: var(--text-dim); font-size: 12px; cursor:pointer;
    min-height: 48px; transition: all .15s;
  }
  .add-tracker:hover{ color: var(--text); border-color: var(--text-faint); background: rgba(255,255,255,0.02); }

  /* checklist */
  .checklist{ display:flex; flex-direction:column; gap:5px; margin-top: 4px; }
  .check-row{
    display:flex; align-items:center; gap:9px; background: var(--surface-2);
    border: 1px solid var(--border-soft); border-radius: 8px; padding: 7px 10px; position:relative;
  }
  .check-row .del{ color: var(--text-faint); font-size:12px; cursor:pointer; opacity:0; transition:opacity .15s; margin-left:4px;}
  .check-row:hover .del{ opacity:1; }
  .check-circle{
    width:14px; height:14px; border-radius:50%; border: 1.5px solid var(--text-dim); flex-shrink:0; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .check-circle.done{ background: var(--teal); border-color: var(--teal); }
  .check-circle.done::after{ content:'✓'; font-size:9px; color:#0b0d10; }
  .check-text{ flex:1; font-size: 13px; outline:none; cursor:text; }
  .check-text.done{ color: var(--text-faint); text-decoration: line-through; }
  .add-check-row{
    display:flex; align-items:center; gap:8px; padding: 7px 10px; color: var(--text-dim);
    font-size: 11.5px; cursor:pointer; border: 1px dashed var(--border); border-radius: 8px;
  }
  .add-check-row:hover{ color: var(--text); border-color: var(--text-faint); }

  .quick-add-row{ display:flex; gap:6px; margin-top: 8px; flex-wrap:wrap; }
  .quick-add-row .btn-mini-ghost{
    font-family: var(--font-mono); font-size: 10.5px; color: var(--text-dim); background:none;
    border: 1px solid var(--border-soft); border-radius: 999px; padding: 5px 11px; cursor:pointer;
  }
  .quick-add-row .btn-mini-ghost:hover{ color: var(--text); border-color: var(--text-faint); }

  /* ---------- empty state ---------- */
  .empty-state{
    text-align:center; padding: 60px 20px; border: 1px dashed var(--border); border-radius: 14px;
  }
  .empty-state h2{ font-family: var(--font-display); font-style: italic; font-weight:500; font-size: 22px; margin: 0 0 7px; color: var(--text); }
  .empty-state p{ color: var(--text-dim); font-size: 13.5px; margin: 0 0 18px; }

  /* ---------- modal ---------- */
  .overlay{
    position:fixed; inset:0; background: rgba(5,6,8,0.7); backdrop-filter: blur(3px);
    display:none; align-items:center; justify-content:center; z-index: 100; padding:20px;
  }
  .overlay.open{ display:flex; }
  .modal{
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 18px;
    padding: 28px; width: 100%; max-width: 420px;
  }
  .modal h3{ font-family: var(--font-display); font-style:italic; font-weight:500; font-size:22px; margin: 0 0 20px; }
  .field{ margin-bottom: 16px; }
  .field label{ display:block; font-family: var(--font-mono); font-size: 11.5px; letter-spacing:0.08em; text-transform:uppercase; color: var(--text-dim); margin-bottom:7px; }
  .field input, .field select{
    width:100%; background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 11px 13px; color: var(--text); font-family: var(--font-body); font-size: 15px; outline:none;
  }
  .field input:focus, .field select:focus{ border-color: var(--accent); }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; margin-top: 22px; }

  ::selection{ background: var(--accent-soft); }
  .work-complete{ opacity: 0.72; }
  .work-complete:hover{ opacity: 0.92; }
  .icon-btn[data-action="move-up"], .icon-btn[data-action="move-down"]{ font-size: 9px; }
  @media (max-width: 700px){
    .works{ grid-template-columns: 1fr; }
    .work{ padding: 12px; }
    header{ flex-direction:column; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="brand-mark"></div>
      <div>
        <div class="brand-name">FOLIO</div>
        <div class="brand-tag">a record of your study</div>
      </div>
    </div>
    <div class="header-right">
      <div class="save-status"><span class="save-dot" id="saveDot"></span><span id="saveText">saved</span></div>
      <button class="btn btn-ghost" id="exportBtn" title="Download a backup file">Export</button>
      <button class="btn btn-ghost" id="importBtn" title="Restore from a backup file">Import</button>
      <input type="file" id="importFile" accept="application/json" style="display:none;">
      <button class="btn btn-primary" id="addWorkBtn">+ Add work</button>
    </div>
  </header>

  <div class="works" id="works"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Add work</h3>
    <div class="field">
      <label>Category</label>
      <select id="newCategory">
        <option value="COURSE">Course</option>
        <option value="TEXTBOOK">Textbook</option>
        <option value="NOVEL">Novel</option>
        <option value="PAPER">Paper</option>
        <option value="CUSTOM">Custom</option>
      </select>
    </div>
    <div class="field">
      <label>Title</label>
      <input id="newTitle" placeholder="e.g. MIT 8.04 Quantum Physics I" autocomplete="off">
    </div>
    <div class="field">
      <label>Subtitle (optional)</label>
      <input id="newSubtitle" placeholder="Instructor, author, or notes" autocomplete="off">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="cancelAdd">Cancel</button>
      <button class="btn btn-primary" id="confirmAdd">Create</button>
    </div>
  </div>
</div>

<script>
(function(){
  const COLORS = ['teal','accent','rose','indigo'];
  const STORAGE_KEY = 'folio-works';
  let works = [];
  let saveTimer = null;

  const worksEl = document.getElementById('works');
  const overlay = document.getElementById('overlay');
  const saveDot = document.getElementById('saveDot');
  const saveText = document.getElementById('saveText');

  function uid(){ return 'id-' + Math.random().toString(36).slice(2,10) + Date.now().toString(36); }

  function colorVar(c){
    if(c==='teal') return 'var(--teal)';
    if(c==='rose') return 'var(--rose)';
    if(c==='indigo') return 'var(--indigo)';
    return 'var(--accent)';
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      works = raw ? JSON.parse(raw) : [];
    }catch(e){
      works = [];
      saveText.textContent = 'storage unavailable';
      saveDot.style.background = 'var(--rose)';
    }
    render();
  }

  function scheduleSave(){
    saveDot.classList.add('saving');
    saveText.textContent = 'saving…';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(doSave, 350);
  }

  function doSave(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(works));
      saveDot.classList.remove('saving');
      saveDot.style.background = '';
      const t = new Date();
      const h = t.getHours()%12===0?12:t.getHours()%12;
      const m = String(t.getMinutes()).padStart(2,'0');
      const ap = t.getHours()>=12?'pm':'am';
      saveText.textContent = 'saved · ' + h + ':' + m + ap;
    }catch(e){
      saveDot.classList.remove('saving');
      saveDot.style.background = 'var(--rose)';
      saveText.textContent = 'save failed — use Export to back up';
    }
  }

  function exportBackup(){
    const blob = new Blob([JSON.stringify(works, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const stamp = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    a.href = url; a.download = 'folio-backup-'+stamp+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  }

  function importBackup(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!Array.isArray(data)) throw new Error('bad format');
        if(works.length && !confirm('This will replace your current '+works.length+' item(s) with '+data.length+' from the backup. Continue?')) return;
        works = data;
        scheduleSave(); render();
      }catch(err){
        alert('Could not read that file as a Folio backup.');
      }
    };
    reader.readAsText(file);
  }

  function touch(work){ work.updatedAt = Date.now(); }

  function findWork(id){ return works.find(w=>w.id===id); }

  // ---------------- render ----------------
  function render(){
    worksEl.innerHTML = '';
    if(works.length===0){
      worksEl.innerHTML = `
        <div class="empty-state">
          <h2>Nothing logged yet</h2>
          <p>Add your first course, textbook, or novel to begin the record.</p>
          <button class="btn btn-primary" id="emptyAddBtn">+ Add work</button>
        </div>`;
      document.getElementById('emptyAddBtn').onclick = openModal;
      return;
    }
    getDisplayOrder().forEach(work => worksEl.appendChild(renderWork(work)));
  }

  function isComplete(work){
    const hasAny = work.primary || work.trackers.length || work.checklist.length;
    if(!hasAny) return false;
    if(work.primary && work.primary.completed < work.primary.total) return false;
    if(work.trackers.some(t => t.completed < t.total)) return false;
    if(work.checklist.some(c => !c.done)) return false;
    return true;
  }

  function getDisplayOrder(){
    return works
      .map((w, i) => ({ w, i, c: isComplete(w) ? 1 : 0 }))
      .sort((a, b) => (a.c - b.c) || (a.i - b.i))
      .map(x => x.w);
  }

  function moveWork(id, dir){
    const display = getDisplayOrder();
    const idx = display.findIndex(w => w.id === id);
    const targetIdx = idx + dir;
    if(targetIdx < 0 || targetIdx >= display.length) return;
    // only reorder within the same completed/active group — completed items always stay at the bottom
    if(isComplete(display[idx]) !== isComplete(display[targetIdx])) return;
    const realA = works.findIndex(w => w.id === display[idx].id);
    const realB = works.findIndex(w => w.id === display[targetIdx].id);
    [works[realA], works[realB]] = [works[realB], works[realA]];
    scheduleSave(); render();
  }

  function renderWork(work){
    const card = document.createElement('div');
    card.className = 'work' + (work.trackers.length >= 2 ? ' span-2' : '');

    // top
    const top = document.createElement('div');
    top.className = 'work-top';
    top.innerHTML = `
      <div class="work-heading">
        <div class="eyebrow" contenteditable="true" data-field="category">${escapeHtml(work.category||'CUSTOM')}</div>
        <div class="work-title" contenteditable="true" data-field="title">${escapeHtml(work.title||'Untitled')}</div>
        <div class="work-subtitle" contenteditable="true" data-field="subtitle">${work.subtitle ? escapeHtml(work.subtitle) : ''}</div>
      </div>
      <div class="work-controls">
        <button class="icon-btn" data-action="move-up" title="Move up">▲</button>
        <button class="icon-btn" data-action="move-down" title="Move down">▼</button>
        <div style="position:relative;">
          <button class="icon-btn" data-action="menu">⋯</button>
          <div class="menu" data-menu>
            <button data-action="delete-work">Delete work</button>
          </div>
        </div>
      </div>`;
    card.appendChild(top);

    top.querySelector('[data-field="category"]').addEventListener('blur', e=>{
      work.category = e.target.textContent.trim().toUpperCase() || 'CUSTOM';
      touch(work); scheduleSave();
    });
    top.querySelector('[data-field="title"]').addEventListener('blur', e=>{
      work.title = e.target.textContent.trim() || 'Untitled';
      touch(work); scheduleSave();
    });
    const subtitleEl = top.querySelector('[data-field="subtitle"]');
    subtitleEl.setAttribute('data-placeholder', 'Add instructor, author, or notes');
    if(!work.subtitle) subtitleEl.classList.add('empty-hint');
    if(!work.subtitle) subtitleEl.textContent = '';
    subtitleEl.addEventListener('focus', e=>{ e.target.classList.remove('empty-hint'); });
    subtitleEl.addEventListener('blur', e=>{
      const v = e.target.textContent.trim();
      work.subtitle = v;
      if(!v){ e.target.classList.add('empty-hint'); e.target.textContent=''; }
      touch(work); scheduleSave();
    });

    top.querySelector('[data-action="move-up"]').addEventListener('click', ()=> moveWork(work.id, -1));
    top.querySelector('[data-action="move-down"]').addEventListener('click', ()=> moveWork(work.id, 1));

    if(isComplete(work)){
      const badge = document.createElement('span');
      badge.textContent = '✓ complete';
      badge.style.cssText = 'font-family:var(--font-mono);font-size:9px;color:var(--teal);white-space:nowrap;align-self:center;margin-right:4px;';
      top.querySelector('.work-controls').prepend(badge);
      card.classList.add('work-complete');
    }

    const menuBtn = top.querySelector('[data-action="menu"]');
    const menuEl = top.querySelector('[data-menu]');
    menuBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      document.querySelectorAll('.menu.open').forEach(m=>{ if(m!==menuEl) m.classList.remove('open'); });
      menuEl.classList.toggle('open');
    });
    top.querySelector('[data-action="delete-work"]').addEventListener('click', ()=>{
      if(confirm('Delete "'+work.title+'"? This cannot be undone.')){
        works = works.filter(w=>w.id!==work.id);
        scheduleSave(); render();
      }
    });

    // primary
    if(work.primary){
      card.appendChild(renderPrimary(work));
    }

    // trackers
    if(work.trackers.length){
      const trackWrap = document.createElement('div');
      trackWrap.className = 'trackers';
      work.trackers.forEach(t => trackWrap.appendChild(renderTracker(work, t)));
      card.appendChild(trackWrap);
    }

    // checklist
    if(work.checklist.length || work.showChecklist){
      const cl = document.createElement('div');
      cl.className = 'checklist';
      work.checklist.forEach(item => cl.appendChild(renderCheckItem(work, item)));
      const addRow = document.createElement('div');
      addRow.className = 'add-check-row';
      addRow.textContent = '+ Add checklist item';
      addRow.addEventListener('click', ()=>{
        const text = prompt('Item text (e.g. Read & understand)');
        if(!text) return;
        work.checklist.push({ id: uid(), text, done:false });
        touch(work); scheduleSave(); render();
      });
      cl.appendChild(addRow);
      card.appendChild(cl);
    }

    // quick add row — always offers "+ tracker"; conditionally offers progress/checklist
    const quick = document.createElement('div');
    quick.className = 'quick-add-row';

    const addTrackerBtn = document.createElement('button');
    addTrackerBtn.className = 'btn-mini-ghost';
    addTrackerBtn.textContent = '+ tracker';
    addTrackerBtn.addEventListener('click', ()=>{
      const name = prompt('Tracker name (e.g. Videos, Problem Sets, Exams)');
      if(!name) return;
      const unit = prompt('Unit label for one item (e.g. Video, Set, Exam)', name.replace(/s$/,'')) || name;
      const total = parseInt(prompt('Total count', '10')) || 1;
      work.trackers.push({
        id: uid(), name, unit, completed: 0, total,
        next: unit + ' 1', color: COLORS[work.trackers.length % COLORS.length]
      });
      touch(work); scheduleSave(); render();
    });
    quick.appendChild(addTrackerBtn);

    if(!work.primary){
      const b = document.createElement('button');
      b.className = 'btn-mini-ghost';
      b.textContent = '+ progress (e.g. chapters)';
      b.addEventListener('click', ()=>{
        const unit = prompt('What are you counting? (e.g. Chapter, Page)', 'Chapter');
        if(!unit) return;
        const total = parseInt(prompt('Total ' + unit.toLowerCase() + 's', '10')) || 1;
        work.primary = { unit, completed: 0, total, currentLabel: unit + ' 1' };
        touch(work); scheduleSave(); render();
      });
      quick.appendChild(b);
    }
    if(!work.checklist.length && !work.showChecklist){
      const b2 = document.createElement('button');
      b2.className = 'btn-mini-ghost';
      b2.textContent = '+ checklist';
      b2.addEventListener('click', ()=>{
        work.showChecklist = true;
        touch(work); scheduleSave(); render();
      });
      quick.appendChild(b2);
    }
    if(quick.children.length) card.appendChild(quick);

    return card;
  }

  function renderPrimary(work){
    const p = work.primary;
    const wrap = document.createElement('div');
    wrap.className = 'primary';
    const pct = Math.min(100, Math.round((p.completed / Math.max(p.total,1)) * 100));
    const remaining = Math.max(p.total - p.completed, 0);
    wrap.innerHTML = `
      <div class="primary-row">
        <div class="primary-label">Current · <input type="text" value="${escapeAttr(p.currentLabel)}" data-cur></div>
        <div class="primary-remaining">${remaining} ${p.unit.toLowerCase()}${remaining===1?'':'s'} remaining</div>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div class="primary-foot">
        <span>${p.completed} completed</span>
        <span style="margin-left:16px;">total: <input type="text" value="${p.total}" data-total style="width:36px;background:none;border:none;color:var(--text-faint);font-family:var(--font-mono);font-size:10.5px;outline:none;border-bottom:1px dashed var(--text-faint);"></span>
        <button class="mini-btn ghost done-btn" data-action="undo" ${p.completed<=0?'disabled':''} style="margin-left:auto;">Undo</button>
        <button class="mini-btn done-btn" ${p.completed>=p.total?'disabled':''} data-action="advance">${p.completed>=p.total?'Complete':'Done'}</button>
      </div>`;
    wrap.querySelector('[data-cur]').addEventListener('blur', e=>{
      p.currentLabel = e.target.value.trim(); touch(work); scheduleSave();
    });
    wrap.querySelector('[data-total]').addEventListener('blur', e=>{
      const v = parseInt(e.target.value); if(v>0){ p.total = v; touch(work); scheduleSave(); render(); }
    });
    const btn = wrap.querySelector('[data-action="advance"]');
    if(btn) btn.addEventListener('click', ()=>{
      const prevDefault = p.unit + ' ' + (p.completed+1);
      if(p.completed < p.total) p.completed += 1;
      if(p.currentLabel === (p.unit + ' ' + p.completed) || p.currentLabel === prevDefault || !p.currentLabel){
        p.currentLabel = p.unit + ' ' + Math.min(p.completed+1, p.total);
      }
      touch(work); scheduleSave(); render();
    });
    const undoBtn = wrap.querySelector('[data-action="undo"]');
    if(undoBtn) undoBtn.addEventListener('click', ()=>{
      if(p.completed<=0) return;
      const defaultLabel = p.unit + ' ' + (p.completed+1);
      p.completed -= 1;
      if(p.currentLabel === defaultLabel || !p.currentLabel){
        p.currentLabel = p.unit + ' ' + Math.min(p.completed+1, p.total);
      }
      touch(work); scheduleSave(); render();
    });
    return wrap;
  }

  function renderTracker(work, t){
    const el = document.createElement('div');
    el.className = 'tracker';
    const pct = Math.min(100, Math.round((t.completed / Math.max(t.total,1)) * 100));
    const remaining = Math.max(t.total - t.completed, 0);
    el.innerHTML = `
      <span class="del" data-action="del-tracker">✕</span>
      <div class="tracker-head">
        <span class="dot" style="background:${colorVar(t.color)}"></span>
        <span class="tracker-name" contenteditable="true" data-field="name">${escapeHtml(t.name)}</span>
        <span class="tracker-pct">${pct}%</span>
      </div>
      <div class="tracker-next" contenteditable="true" data-field="next">Next · ${escapeHtml(t.next||'')}</div>
      <div class="tracker-sub">${t.completed} completed</div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%; background:${colorVar(t.color)}"></div></div>
      <div class="tracker-foot">
        <span class="tracker-sub" style="margin-right:auto;">${remaining} remaining</span>
        <button class="mini-btn ghost" data-action="undo" ${t.completed<=0?'disabled':''} style="margin-right:6px;">Undo</button>
        <button class="mini-btn" data-action="advance" ${t.completed>=t.total?'disabled':''}>${t.completed>=t.total?'Complete':'Done'}</button>
      </div>`;

    el.querySelector('[data-action="del-tracker"]').addEventListener('click', ()=>{
      work.trackers = work.trackers.filter(x=>x.id!==t.id);
      touch(work); scheduleSave(); render();
    });
    el.querySelector('[data-field="name"]').addEventListener('blur', e=>{
      t.name = e.target.textContent.trim() || t.name; touch(work); scheduleSave();
    });
    const nextEl = el.querySelector('[data-field="next"]');
    nextEl.addEventListener('focus', e=>{ e.target.textContent = t.next||''; });
    nextEl.addEventListener('blur', e=>{
      t.next = e.target.textContent.replace(/^Next\s*·\s*/,'').trim();
      touch(work); scheduleSave(); render();
    });
    const undoBtn = el.querySelector('[data-action="undo"]');
    if(undoBtn) undoBtn.addEventListener('click', ()=>{
      if(t.completed<=0) return;
      const defaultNext = t.unit + ' ' + (t.completed+1);
      t.completed -= 1;
      if(t.next === defaultNext || !t.next){
        t.next = t.unit + ' ' + (t.completed+1);
      }
      touch(work); scheduleSave(); render();
    });
    const advBtn = el.querySelector('[data-action="advance"]');
    if(advBtn) advBtn.addEventListener('click', ()=>{
      const prevDefault = t.unit + ' ' + (t.completed+1);
      if(t.completed < t.total) t.completed += 1;
      if(t.next === prevDefault || !t.next || t.next === (t.unit + ' ' + t.completed)){
        t.next = t.unit + ' ' + Math.min(t.completed+1, t.total);
      }
      touch(work); scheduleSave(); render();
    });
    return el;
  }

  function renderCheckItem(work, item){
    const row = document.createElement('div');
    row.className = 'check-row';
    row.innerHTML = `
      <div class="check-circle ${item.done?'done':''}" data-action="toggle"></div>
      <div class="check-text ${item.done?'done':''}" contenteditable="true" data-field="text">${escapeHtml(item.text)}</div>
      <button class="mini-btn ghost" data-action="toggle-btn">${item.done?'Undo':'Done'}</button>
      <span class="del" data-action="del-item">✕</span>`;
    const toggle = ()=>{ item.done = !item.done; touch(work); scheduleSave(); render(); };
    row.querySelector('[data-action="toggle"]').addEventListener('click', toggle);
    row.querySelector('[data-action="toggle-btn"]').addEventListener('click', toggle);
    row.querySelector('[data-field="text"]').addEventListener('blur', e=>{
      item.text = e.target.textContent.trim() || item.text; touch(work); scheduleSave();
    });
    row.querySelector('[data-action="del-item"]').addEventListener('click', ()=>{
      work.checklist = work.checklist.filter(x=>x.id!==item.id);
      touch(work); scheduleSave(); render();
    });
    return row;
  }

  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHtml(s); }

  // close menus when clicking elsewhere
  document.addEventListener('click', ()=>{
    document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));
  });

  // ---------------- add work modal ----------------
  function openModal(){
    overlay.classList.add('open');
    document.getElementById('newTitle').value = '';
    document.getElementById('newSubtitle').value = '';
    document.getElementById('newCategory').value = 'COURSE';
    document.getElementById('newTitle').focus();
  }
  function closeModal(){ overlay.classList.remove('open'); }

  document.getElementById('addWorkBtn').addEventListener('click', openModal);
  document.getElementById('cancelAdd').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });

  document.getElementById('confirmAdd').addEventListener('click', ()=>{
    const title = document.getElementById('newTitle').value.trim();
    if(!title){ document.getElementById('newTitle').focus(); return; }
    const category = document.getElementById('newCategory').value;
    const subtitle = document.getElementById('newSubtitle').value.trim();
    works.unshift({
      id: uid(), category, title, subtitle,
      primary: null, trackers: [], checklist: [], showChecklist:false,
      createdAt: Date.now(), updatedAt: Date.now()
    });
    scheduleSave(); render(); closeModal();
  });

  document.getElementById('newTitle').addEventListener('keydown', e=>{
    if(e.key==='Enter') document.getElementById('confirmAdd').click();
  });

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', ()=>{
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });

  loadData();
})();
</script>
</body>
</html>
